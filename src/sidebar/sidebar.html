<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Assistant</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div id="sidebar-root">

    <div id="header">
      <span id="header-title">Job Assistant</span>
      <div id="header-actions">
        <button id="settings-btn" title="Settings">⚙</button>
        <button id="close-btn" title="Close">✕</button>
      </div>
    </div>

    <div id="stale-warning" class="hidden">
      <span id="stale-msg">JD captured from a different page.</span>
      <div id="stale-actions">
        <button class="stale-btn" id="stale-redetect">Re-detect</button>
        <button class="stale-btn" id="stale-keep">Keep</button>
        <button class="stale-btn" id="stale-clear">Clear</button>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Active Job</div>
      <div id="job-header">
        <div id="job-title-row">
          <span id="job-title-display">No job loaded</span>
          <div id="job-header-btns">
            <button class="sm-btn" id="copy-jd-btn">Copy JD</button>
            <button class="sm-btn danger" id="clear-job-btn">Clear</button>
          </div>
        </div>
        <div id="job-preview"></div>
        <button id="expand-jd-btn" class="expand-btn">▸ Edit job description</button>
        <div id="jd-expanded" class="hidden">
          <textarea id="jd-textarea" placeholder="Job description will appear here after capture…"></textarea>
          <div class="row-end">
            <button class="sm-btn" id="save-jd-btn">Save</button>
          </div>
        </div>
        <div id="clear-confirm" class="hidden confirm-bar">
          <span>Clear this job?</span>
          <button class="sm-btn danger" id="clear-confirm-yes">Yes, clear</button>
          <button class="sm-btn" id="clear-confirm-no">Cancel</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Ask / Generate</div>
      <textarea id="question-input" placeholder="Question or prompt (optional)…"></textarea>
      <div id="generate-btns">
        <button class="btn-primary full-width" id="generate-answer-btn">Generate Answer</button>
        <button class="btn-secondary full-width" id="cover-letter-btn">Cover Letter</button>
      </div>
      <div id="context-indicator"></div>
    </div>

    <div id="result-section" class="section hidden">
      <div class="section-label">Result</div>
      <div id="result-area"></div>
      <div class="row-end">
        <button class="sm-btn" id="copy-result-btn">Copy</button>
      </div>
    </div>

    <div id="explain-section" class="section hidden">
      <div class="section-label">Explain</div>
      <div id="explain-area"></div>
      <div class="row-end">
        <button class="sm-btn" id="copy-explain-btn">Copy</button>
      </div>
    </div>

  </div>
  <script src="sidebar.js"></script>
</body>
</html>
